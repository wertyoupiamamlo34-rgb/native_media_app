name: native_media_app
description: Flutter UI for native Android media player
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  wakelock_plus: ^1.3.0
  audio_waveforms: ^2.0.0
  image_picker: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Circle.png
  remove_alpha_ios: false
  web:
    generate: true
    image_path: assets/images/Circle.png
  windows:
    generate: true
    image_path: assets/images/Circle.png
  macos:
    generate: true
    image_path: assets/images/Circle.png

flutter:
  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/
  uses-material-design: true
